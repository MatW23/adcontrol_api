<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Acesso{% endblock %} - AdControl Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-acesso">
  <main class="acesso">
    <div class="acesso-marca">
      <svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#FFC93C"/>
        <rect x="7" y="17" width="4.5" height="8" rx="1" fill="#0E3B43"/>
        <rect x="13.75" y="12" width="4.5" height="13" rx="1" fill="#0E3B43"/>
        <rect x="20.5" y="7" width="4.5" height="18" rx="1" fill="#0E3B43"/>
      </svg>
      <div><strong>AdControl</strong><span>Presente na Web</span></div>
    </div>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
      <div class="aviso aviso-{{ categoria }}" role="{{ 'alert' if categoria == 'erro' else 'status' }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    <section class="painel acesso-painel">
      {% block corpo %}{% endblock %}
    </section>
  </main>
</body>
</html>
